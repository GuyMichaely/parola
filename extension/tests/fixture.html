<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Duolingo detector fixture</title></head>
  <body>
    <main>
      <section id="exercise" data-test="challenge challenge-translate" style="padding: 30px;">
        <div id="marker" style="color: rgb(206, 130, 255); font-weight: 700;">NEW WORD</div>
        <h1 data-test="challenge-header">Write this in English</h1>
        <div id="prompt" style="margin-top: 20px;">
          <span lang="it">
            <span aria-hidden="true">la gonna verde</span>
            <span data-test="hint-token" aria-label="la" style="display:inline-block;width:12px;height:20px;"></span>
            <span data-test="hint-token" aria-label="gonna" style="display:inline-block;width:45px;height:20px;"></span>
            <span id="new-word" data-test="hint-token" aria-label="verde" style="display:inline-block;width:45px;height:20px;">
              <i></i><i></i><i></i>
            </span>
          </span>
        </div>
        <div style="margin-top: 20px; color: rgb(85, 95, 105);">cute skirt the green beautiful cheap</div>
      </section>
    </main>
  </body>
</html>
