<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Parola review</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body>
    <main class="review-shell">
      <header class="review-header">
        <div>
          <span class="eyebrow">Parola for Duolingo</span>
          <h1>Review staged words</h1>
        </div>
        <code id="version"></code>
      </header>

      <section>
        <div class="section-heading">
          <div>
            <h2>Staged</h2>
            <p>Approve words you want to keep for the Parola import step; discard false positives.</p>
          </div>
          <button id="clear-staged" class="danger-subtle">Clear staged</button>
        </div>
        <div id="staged-list" class="card-list"></div>
      </section>

      <section class="diagnostics-section">
        <div class="section-heading">
          <div>
            <h2>Diagnostics</h2>
            <p>Every positive detector result is logged. Manual missed-word snapshots appear here too.</p>
          </div>
          <div class="inline-actions">
            <button id="export-diagnostics">Export JSON</button>
            <button id="clear-diagnostics" class="danger-subtle">Clear diagnostics</button>
          </div>
        </div>
        <div id="diagnostics-summary" class="diagnostics-summary"></div>
      </section>
    </main>
    <script type="module" src="review.js"></script>
  </body>
</html>
