<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Parola Capture</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="popup-body">
    <main class="popup-shell">
      <div class="brand-row">
        <div>
          <strong>Parola</strong>
          <span>Capture</span>
        </div>
        <code id="version"></code>
      </div>

      <form id="capture-form" class="capture-form">
        <label for="capture-input">Stage a word</label>
        <textarea id="capture-input" rows="3" placeholder="gatto&#10;or: Vorrei un *panino*, per favore."></textarea>
        <button type="submit" class="primary">Stage</button>
        <p class="fine-print">Enter one word, or enter a sentence and surround the word of interest with <strong>*asterisks*</strong>. You can also highlight text on any page and right-click → Stage in Parola.</p>
      </form>

      <section class="summary-card">
        <span class="eyebrow">Staged words</span>
        <strong id="staged-count" class="big-number">0</strong>
        <div id="word-preview" class="word-preview"></div>
      </section>

      <p id="status" class="status-line" role="status"></p>
      <div class="button-stack">
        <button id="review">Review staged words</button>
        <button id="export-debug">Export debug log</button>
      </div>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
