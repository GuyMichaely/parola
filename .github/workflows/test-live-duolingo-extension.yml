name: Test live Duolingo extension

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "extension/background.js"
      - "extension/content/duolingo.js"
      - "extension/manifest.json"
      - "extension/review.html"
      - "extension/review.js"
      - "extension/tests/live-duolingo.py"
      - "extension/tests/fixtures/duolingo-session-state.b64"
      - ".github/workflows/test-live-duolingo-extension.yml"

permissions:
  contents: write

concurrency:
  group: parola-live-duolingo-extension
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Publish this run ID
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > .github/latest-live-duolingo-extension-run
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/latest-live-duolingo-extension-run
          git commit -m "Record latest live Duolingo extension run [skip ci]" || true
          git pull --rebase origin main
          git push

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: extension/tests/requirements-live.txt

      - name: Install and validate live-test dependencies
        working-directory: extension
        run: |
          python -m pip install -r tests/requirements-live.txt
          python -m py_compile tests/live-duolingo.py

      - name: Run extension against authenticated Duolingo origin
        working-directory: extension
        env:
          CHROME_PATH: /usr/bin/google-chrome
          DUOLINGO_CAPTURE_DIR: live-extension-capture
          DUOLINGO_SESSION_STATE_FILE: tests/fixtures/duolingo-session-state.b64
        run: xvfb-run -a python tests/live-duolingo.py

      - name: Upload sanitized live-test artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-duolingo-extension-smoke
          path: extension/live-extension-capture
          if-no-files-found: warn
          retention-days: 7
