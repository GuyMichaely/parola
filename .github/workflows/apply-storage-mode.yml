name: Apply storage mode update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-storage-mode.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Apply source update
        run: python3 .github/scripts/apply-storage-mode.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Parola
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Commit source update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/App.tsx web/src/storage.ts web/src/styles.css
          git commit -m "Separate saved endpoint from active storage mode"
          git push
