name: Normalize Parola storage keys

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/normalize-storage-keys.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Normalize storage keys
        run: python3 .github/scripts/normalize-storage-keys.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Parola
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Commit normalized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web
          if git diff --cached --quiet; then
            echo "No storage-key changes needed."
            exit 0
          fi
          git commit -m "Use clean localStorage keys"
          git push
