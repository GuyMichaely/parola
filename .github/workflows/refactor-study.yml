name: Refactor study logic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refactor-study.yml"
      - ".github/scripts/refactor-study.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract study logic
        run: python3 .github/scripts/refactor-study.py

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src
          git commit -m "Extract study logic"
          git push
