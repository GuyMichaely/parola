name: Capture Duolingo on GitHub runner

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/trigger-duolingo-local

permissions:
  contents: write

concurrency:
  group: parola-duolingo-local
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Publish this run ID
        shell: bash
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > .github/latest-duolingo-local-run
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/latest-duolingo-local-run
          git commit -m "Record latest GitHub-only Duolingo run" || true
          git push

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: extension/tests/requirements-live.txt

      - name: Install nodriver
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r extension/tests/requirements-live.txt
          google-chrome --version

      - name: Test accepted login pattern entirely on GitHub runner
        working-directory: extension
        env:
          DUOLINGO_CAPTURE_DIR: gold-local-capture
          CHROME_PATH: /usr/bin/google-chrome
        run: python tests/duolingo-gold-local.py

      - name: Upload GitHub-only login capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duolingo-gold-local
          path: extension/gold-local-capture
          if-no-files-found: warn
          retention-days: 14
