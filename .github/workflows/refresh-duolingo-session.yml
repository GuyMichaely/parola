name: Refresh committed Duolingo session

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/trigger-duolingo-session-refresh

permissions:
  contents: write

concurrency:
  group: parola-duolingo-session-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Publish this run ID
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > .github/latest-duolingo-session-refresh-run
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/latest-duolingo-session-refresh-run
          git commit -m "Record latest Duolingo session refresh run [skip ci]" || true
          git pull --rebase origin main
          git push

      - name: Connect to residential tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:parola-ci
          version: latest
          timeout: 30s
          retry: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: extension/tests/requirements-live.txt

      - name: Verify residential Chrome is reachable
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r extension/tests/requirements-live.txt
          for _ in $(seq 1 30); do
            curl -fsS http://parola-residential-exit:9222/json/version >/dev/null && exit 0
            sleep 1
          done
          echo "Could not reach residential Chrome" >&2
          tailscale status || true
          exit 1

      - name: Establish accepted Duolingo login
        working-directory: extension
        env:
          DUOLINGO_CAPTURE_DIR: session-refresh-login
          DUOLINGO_CDP_HOST: parola-residential-exit
          DUOLINGO_CDP_PORT: "9222"
        run: python tests/duolingo-gold-replay.py

      - name: Export authenticated state into repository
        working-directory: extension
        env:
          DUOLINGO_CDP_HOST: parola-residential-exit
          DUOLINGO_CDP_PORT: "9222"
          DUOLINGO_SESSION_OUTPUT: tests/fixtures/duolingo-session-state.b64
        run: python tests/duolingo-export-session.py

      - name: Commit refreshed session state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add extension/tests/fixtures/duolingo-session-state.b64
          git commit -m "Refresh disposable Duolingo test session [skip ci]" || exit 0
          git pull --rebase origin main
          git push

      - name: Upload login diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duolingo-session-refresh-diagnostics
          path: extension/session-refresh-login
          if-no-files-found: warn
          retention-days: 7
