name: Test Parola extension

on:
  push:
    branches: [main]
    paths:
      - "extension/**"
      - ".github/workflows/test-extension.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Publish this run ID
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > .github/latest-extension-test-run
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/latest-extension-test-run
          git commit -m "Record latest extension test run [skip ci]" || true
          git pull --rebase origin main
          git push

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install test dependencies and Chrome
        working-directory: extension
        run: |
          npm install --ignore-scripts
          npx puppeteer browsers install chrome

      - name: Validate extension source
        working-directory: extension
        run: |
          node --check background.js
          node --check content/duolingo.js
          node --check content/parola.js
          node --check popup.js
          node --check review.js
          node -e 'JSON.parse(require("fs").readFileSync("manifest.json", "utf8"))'

      - name: Run Chrome extension tests
        working-directory: extension
        run: xvfb-run -a npm test
