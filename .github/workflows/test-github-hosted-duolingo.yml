name: Test GitHub-hosted Duolingo login

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/trigger-github-hosted-duolingo

permissions:
  contents: write

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Publish this run ID
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > .github/latest-github-hosted-duolingo-run
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/latest-github-hosted-duolingo-run
          git commit -m "Record latest GitHub-hosted Duolingo run [skip ci]"
          git push

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: extension/tests/requirements-live.txt

      - name: Prepare headed local Chrome and nodriver
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r extension/tests/requirements-live.txt

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [[ -z "$CHROME" ]]; then
            echo "Chrome not found" >&2
            exit 1
          fi
          if ! command -v Xvfb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

          Xvfb :99 -screen 0 1280x800x24 >/tmp/parola-xvfb.log 2>&1 &
          echo $! >/tmp/parola-xvfb.pid
          export DISPLAY=:99
          mkdir -p /tmp/parola-github-hosted-profile
          "$CHROME" \
            --user-data-dir=/tmp/parola-github-hosted-profile \
            --remote-debugging-port=9222 \
            --remote-debugging-address=127.0.0.1 \
            --no-first-run \
            --no-default-browser-check \
            --no-sandbox \
            --disable-dev-shm-usage \
            about:blank >/tmp/parola-chrome.out 2>/tmp/parola-chrome.err &
          echo $! >/tmp/parola-chrome.pid

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9222/json/version; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/parola-chrome.err >&2 || true
          cat /tmp/parola-xvfb.log >&2 || true
          exit 1

      - name: Replay successful Duolingo input pattern
        working-directory: extension
        env:
          DUOLINGO_CAPTURE_DIR: github-hosted-gold-replay
          DUOLINGO_CDP_HOST: 127.0.0.1
          DUOLINGO_CDP_PORT: "9222"
        run: python tests/duolingo-gold-replay.py

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-hosted-duolingo-gold-replay
          path: extension/github-hosted-gold-replay
          if-no-files-found: warn
          retention-days: 7

      - name: Stop browser stack
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/parola-chrome.pid ]]; then kill "$(cat /tmp/parola-chrome.pid)" 2>/dev/null || true; fi
          if [[ -f /tmp/parola-xvfb.pid ]]; then kill "$(cat /tmp/parola-xvfb.pid)" 2>/dev/null || true; fi
