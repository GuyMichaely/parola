name: Capture live Duolingo

# Real-site integration test. This intentionally runs only on the dedicated
# private residential runner so Duolingo sees the normal home connection.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-duolingo.yml"
      - "extension/tests/live-duolingo.py"
      - "extension/tests/requirements-live.txt"
      - "extension/tests/duolingo-test-account.json"
      - "extension/manifest.json"
      - "extension/background.js"
      - "extension/content/**"
      - "extension/popup.*"
      - "extension/review.*"
      - "extension/ui.css"

permissions:
  contents: read

concurrency:
  group: parola-duolingo-live
  cancel-in-progress: true

jobs:
  capture:
    runs-on: [self-hosted, linux, x64, parola-duolingo]
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare Python environment
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m venv .venv-live
          . .venv-live/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r extension/tests/requirements-live.txt
          python -c 'import nodriver; print("nodriver", nodriver.__version__)'
          echo "$PWD/.venv-live/bin" >> "$GITHUB_PATH"

      - name: Find local Chrome
        shell: bash
        run: |
          set -euo pipefail

          CHROME_PATH=""
          for browser in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$browser" >/dev/null 2>&1; then
              CHROME_PATH="$(command -v "$browser")"
              break
            fi
          done

          test -n "$CHROME_PATH" || {
            echo "No supported Chrome/Chromium executable was found on the runner." >&2
            exit 1
          }

          command -v xvfb-run >/dev/null 2>&1 || {
            echo "xvfb-run is not installed on the runner." >&2
            exit 1
          }

          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Capture live Duolingo session with nodriver
        working-directory: extension
        env:
          DUOLINGO_CAPTURE_DIR: live-capture
        run: xvfb-run -a python tests/live-duolingo.py

      - name: Upload live capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duolingo-live-capture
          path: extension/live-capture
          if-no-files-found: warn
          retention-days: 14
