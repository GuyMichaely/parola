name: Capture live Duolingo

# Diagnostic: run a minimal regular-Chrome login from a GitHub-hosted runner,
# routing only its Internet traffic through the residential exit node.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-duolingo.yml"

permissions:
  contents: read

concurrency:
  group: parola-duolingo-live
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Connect to residential tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:parola-ci
          version: latest
          timeout: 30s
          retry: 1

      - name: Route Internet traffic through residential exit node
        shell: bash
        run: |
          set -euo pipefail
          sudo tailscale set --exit-node=parola-residential-exit
          tailscale status

      - name: Verify residential egress fingerprint
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_IP="$(curl -4fsSL https://api.ipify.org)"
          printf '%s' "$PUBLIC_IP" | sha256sum | awk '{print "Residential egress SHA256: "$1}'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: extension/tests/requirements-live.txt

      - name: Prepare regular Chrome and nodriver
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r extension/tests/requirements-live.txt

          CHROME_PATH=""
          for browser in google-chrome-stable google-chrome; do
            if command -v "$browser" >/dev/null 2>&1; then
              CHROME_PATH="$(command -v "$browser")"
              break
            fi
          done

          test -n "$CHROME_PATH" || {
            echo "Regular Google Chrome is not available on the hosted runner." >&2
            exit 1
          }
          command -v xvfb-run >/dev/null 2>&1

          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          python -c 'import nodriver; print("nodriver", nodriver.__version__)'
          "$CHROME_PATH" --version

      - name: Probe Duolingo login with clean Chrome
        working-directory: extension
        env:
          DUOLINGO_CAPTURE_DIR: login-probe-capture
        run: xvfb-run -a python tests/duolingo-login-probe.py

      - name: Upload login probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duolingo-login-probe
          path: extension/login-probe-capture
          if-no-files-found: warn
          retention-days: 14
