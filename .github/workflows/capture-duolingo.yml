name: Capture live Duolingo

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/trigger-duolingo-capture

permissions:
  contents: write

concurrency:
  group: parola-duolingo-live
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Publish this run ID
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > .github/latest-duolingo-run
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/latest-duolingo-run
          git commit -m "Record latest Duolingo capture run [skip ci]"
          git push

      - name: Connect to residential tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:parola-ci
          version: latest
          timeout: 30s
          retry: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: extension/tests/requirements-live.txt

      - name: Prepare remote Chrome tunnel and nodriver
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r extension/tests/requirements-live.txt
          if ! command -v socat >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y socat
          fi
          socat TCP-LISTEN:9222,bind=127.0.0.1,reuseaddr,fork TCP:parola-residential-exit:9222 &
          echo $! > /tmp/parola-cdp-socat.pid
          READY=false
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:9222/json/version >/tmp/parola-chrome-version.json; then READY=true; break; fi
            sleep 1
          done
          if [[ "$READY" != "true" ]]; then
            echo "Could not reach the residential Chrome CDP endpoint." >&2
            tailscale status
            exit 1
          fi
          python -c 'import nodriver; print("nodriver", nodriver.__version__)'

      - name: Compare accepted and rejected login requests
        working-directory: extension
        env:
          DUOLINGO_CAPTURE_DIR: request-diff-capture
          DUOLINGO_CDP_HOST: 127.0.0.1
          DUOLINGO_CDP_PORT: "9222"
        run: python tests/duolingo-request-diff.py

      - name: Upload request diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duolingo-request-diff
          path: extension/request-diff-capture
          if-no-files-found: warn
          retention-days: 14

      - name: Stop CDP tunnel
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/parola-cdp-socat.pid ]]; then
            kill "$(cat /tmp/parola-cdp-socat.pid)" 2>/dev/null || true
          fi
