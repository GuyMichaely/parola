name: Capture live Duolingo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-duolingo.yml"
      - "extension/tests/live-duolingo.py"
      - "extension/tests/requirements-live.txt"
      - "extension/package.json"
      - "extension/package-lock.json"
      - "extension/manifest.json"
      - "extension/background.js"
      - "extension/content/**"
      - "extension/popup.*"
      - "extension/review.*"
      - "extension/ui.css"

permissions:
  contents: read

concurrency:
  group: parola-duolingo-live
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: extension/tests/requirements-live.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install nodriver and Chrome for Testing
        working-directory: extension
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements-live.txt
          npm install --ignore-scripts
          npx puppeteer browsers install chrome

          CHROME_PATH="$(node --input-type=module - <<'NODE'
          import puppeteer from 'puppeteer';
          console.log(puppeteer.executablePath());
          NODE
          )"

          test -x "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          python -c 'import nodriver; print("nodriver", nodriver.__version__)'
          "$CHROME_PATH" --version

      - name: Check live-test credentials
        id: credentials
        env:
          DUOLINGO_TEST_EMAIL: ${{ secrets.DUOLINGO_TEST_EMAIL }}
          DUOLINGO_TEST_PASSWORD: ${{ secrets.DUOLINGO_TEST_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$DUOLINGO_TEST_EMAIL" && -n "$DUOLINGO_TEST_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Live capture credentials are not configured; skipping browser login."
          fi

      - name: Capture live Duolingo session with nodriver
        if: steps.credentials.outputs.configured == 'true'
        working-directory: extension
        env:
          DUOLINGO_TEST_EMAIL: ${{ secrets.DUOLINGO_TEST_EMAIL }}
          DUOLINGO_TEST_PASSWORD: ${{ secrets.DUOLINGO_TEST_PASSWORD }}
          DUOLINGO_CAPTURE_DIR: live-capture
        run: xvfb-run -a python tests/live-duolingo.py

      - name: Upload live capture
        if: always() && steps.credentials.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: duolingo-live-capture
          path: extension/live-capture
          if-no-files-found: warn
          retention-days: 14
