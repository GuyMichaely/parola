name: Capture live Duolingo

# Live-site integration test runs in GitHub-hosted Chrome. Tailscale routes the
# runner's Internet traffic through the residential exit node so the browser
# itself never runs on the residential machine.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-duolingo.yml"

permissions:
  contents: read

concurrency:
  group: parola-duolingo-live
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Connect to residential tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:parola-ci
          version: latest
          timeout: 30s
          retry: 0

      - name: Route Internet traffic through residential exit node
        shell: bash
        run: |
          set -euo pipefail
          sudo tailscale set --exit-node=parola-residential-exit
          tailscale status

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: extension/tests/requirements-live.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install nodriver and Chrome for Testing
        working-directory: extension
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements-live.txt
          npm install --ignore-scripts
          npx puppeteer browsers install chrome

          CHROME_PATH="$(find "$HOME/.cache/puppeteer/chrome" -type f -path '*/chrome-linux64/chrome' -perm -u+x | sort | tail -n 1)"
          test -n "$CHROME_PATH"
          test -x "$CHROME_PATH"

          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          python -c 'import nodriver; print("nodriver", nodriver.__version__)'
          "$CHROME_PATH" --version

      - name: Capture live Duolingo session with nodriver
        working-directory: extension
        env:
          DUOLINGO_CAPTURE_DIR: live-capture
        run: xvfb-run -a python tests/live-duolingo.py

      - name: Upload live capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duolingo-live-capture
          path: extension/live-capture
          if-no-files-found: warn
          retention-days: 14
