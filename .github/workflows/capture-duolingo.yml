name: Capture live Duolingo

# GitHub runs the automation driver. A dedicated Chrome process runs on the
# residential machine and exposes only its CDP port privately through Tailscale.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/trigger-duolingo-capture

permissions:
  contents: read

concurrency:
  group: parola-duolingo-live
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Connect to residential tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:parola-ci
          version: latest
          timeout: 30s
          retry: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: extension/tests/requirements-live.txt

      - name: Prepare remote Chrome tunnel and nodriver
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r extension/tests/requirements-live.txt

          if ! command -v socat >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y socat
          fi

          socat \
            TCP-LISTEN:9222,bind=127.0.0.1,reuseaddr,fork \
            TCP:parola-residential-exit:9222 &
          echo $! > /tmp/parola-cdp-socat.pid

          READY=false
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:9222/json/version >/tmp/parola-chrome-version.json; then
              READY=true
              break
            fi
            sleep 1
          done

          if [[ "$READY" != "true" ]]; then
            echo "Could not reach the residential Chrome CDP endpoint." >&2
            tailscale status
            exit 1
          fi

          python -c 'import nodriver; print("nodriver", nodriver.__version__)'
          python - <<'PY'
          import json
          with open('/tmp/parola-chrome-version.json', encoding='utf-8') as f:
              data = json.load(f)
          print('Remote browser:', data.get('Browser'))
          PY

      - name: Capture sanitized manual Duolingo login trace
        working-directory: extension
        env:
          DUOLINGO_CAPTURE_DIR: manual-login-trace
          DUOLINGO_CDP_HOST: 127.0.0.1
          DUOLINGO_CDP_PORT: "9222"
          DUOLINGO_MANUAL_TRACE_TIMEOUT_SECONDS: "600"
        run: python tests/duolingo-manual-trace.py

      - name: Upload manual login trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duolingo-manual-login-trace
          path: extension/manual-login-trace
          if-no-files-found: warn
          retention-days: 14

      - name: Stop CDP tunnel
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/parola-cdp-socat.pid ]]; then
            kill "$(cat /tmp/parola-cdp-socat.pid)" 2>/dev/null || true
          fi
