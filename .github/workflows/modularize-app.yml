name: Modularize Parola App

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/modularize-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Modularize App.tsx
        run: python3 .github/scripts/modularize-app.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Parola
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src
          git commit -m "Break App into focused modules"
          git push
