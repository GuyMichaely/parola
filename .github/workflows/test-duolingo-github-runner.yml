name: Test Duolingo on GitHub runner

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/trigger-duolingo-github-runner

permissions:
  contents: write

concurrency:
  group: parola-duolingo-github-runner
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - name: Publish this run ID
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > .github/latest-duolingo-github-runner
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/latest-duolingo-github-runner
          git commit -m "Record latest GitHub-runner Duolingo probe [skip ci]"
          git push

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: extension/tests/requirements-live.txt

      - name: Install probe dependencies
        run: python -m pip install -r extension/tests/requirements-live.txt

      - name: Run Duolingo entirely on GitHub-hosted runner
        working-directory: extension
        env:
          CHROME_PATH: /usr/bin/google-chrome
          DUOLINGO_CAPTURE_DIR: github-runner-capture
        run: python tests/duolingo-github-runner-probe.py

      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duolingo-github-runner-probe
          path: extension/github-runner-capture
          if-no-files-found: warn
          retention-days: 14
