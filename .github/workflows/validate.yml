name: Validate Parola

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "api/**"
      - "extension/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "web/**"
      - "api/**"
      - "extension/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parola-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run web tests
        working-directory: web
        run: npm test

      - name: Build web app
        working-directory: web
        run: npm run build

      - name: Check API syntax
        run: node --check api/server.mjs

      - name: Check extension syntax
        working-directory: extension
        run: |
          node --check background.js
          node --check content/parola.js
          node --check focus-preservation.js
          node --check popup.js
          node --check review.js
          node -e 'const manifest = JSON.parse(require("fs").readFileSync("manifest.json", "utf8")); if (!manifest.version) throw new Error("manifest version is required")'
