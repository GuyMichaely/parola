name: Smoke test live Parola

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/smoke-test-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Smoke test live frontend and API
        shell: bash
        run: |
          set -euo pipefail

          FRONTEND="https://guymichaely.com/parola/"
          API="https://parola-api-12706-4372.azurewebsites.net"

          echo "Fetching frontend..."
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL "$FRONTEND" -o /tmp/parola-index.html
          grep -q '<div id="root"></div>' /tmp/parola-index.html

          ASSET_PATH="$(grep -oE 'src="[^"]+\.js"' /tmp/parola-index.html | head -n 1 | cut -d'"' -f2)"
          test -n "$ASSET_PATH"
          ASSET_URL="$(python3 - "$FRONTEND" "$ASSET_PATH" <<'PY'
          import sys
          from urllib.parse import urljoin
          print(urljoin(sys.argv[1], sys.argv[2]))
          PY
          )"
          echo "Fetching deployed JS: $ASSET_URL"
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL "$ASSET_URL" -o /tmp/parola-app.js
          test -s /tmp/parola-app.js
          grep -q 'Inventory' /tmp/parola-app.js
          grep -q 'Remote API endpoint' /tmp/parola-app.js

          echo "Checking API health..."
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL "$API/health" -o /tmp/health.json
          python3 - <<'PY'
          import json
          with open('/tmp/health.json') as f:
              payload = json.load(f)
          assert payload.get('ok') is True, payload
          PY

          echo "Checking cards response..."
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL "$API/cards" -o /tmp/cards.json
          python3 - <<'PY'
          import json
          with open('/tmp/cards.json') as f:
              payload = json.load(f)
          cards = payload if isinstance(payload, list) else payload.get('cards')
          assert isinstance(cards, list), payload
          print(f"Cards endpoint returned {len(cards)} cards.")
          PY

          echo "Checking CORS preflight..."
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsS \
            -X OPTIONS "$API/cards" \
            -H 'Origin: https://guymichaely.com' \
            -H 'Access-Control-Request-Method: GET' \
            -D /tmp/cors-headers.txt \
            -o /tmp/cors-body.txt
          tr -d '\r' < /tmp/cors-headers.txt | grep -qi '^access-control-allow-origin: https://guymichaely.com$'

          echo "Live Parola smoke test passed."
