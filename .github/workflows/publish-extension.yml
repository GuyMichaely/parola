name: Publish Parola extension

on:
  push:
    branches: [main]
    paths:
      - "extension/manifest.json"
      - "extension/background.js"
      - "extension/content/**"
      - "extension/popup.html"
      - "extension/popup.js"
      - "extension/review.html"
      - "extension/review.js"
      - "extension/ui.css"
      - ".github/workflows/publish-extension.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parola-public-deploy
  cancel-in-progress: false

env:
  EXTENSION_UPDATE_URL: https://guymichaely.com/extension/updates.xml
  EXTENSION_CRX_URL: https://guymichaely.com/extension/parola-duolingo.crx

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Parola source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install test dependencies and Chrome
        working-directory: extension
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npx puppeteer browsers install chrome
          CHROME_PATH="$(find "$HOME/.cache/puppeteer/chrome" -type f -path '*/chrome-linux64/chrome' -perm -u+x | sort | tail -n 1)"
          test -n "$CHROME_PATH"
          test -x "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Test extension before packaging
        working-directory: extension
        run: xvfb-run -a npm test

      - name: Build signed CRX and update manifest
        env:
          PRIVATE_KEY: ${{ secrets.PAROLA_EXTENSION_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_KEY"

          VERSION="0.1.${GITHUB_RUN_NUMBER}"
          RELEASE_DIR="$RUNNER_TEMP/parola-extension-release"
          BUILD_DIR="$RUNNER_TEMP/parola-duolingo"
          KEY_FILE="$RUNNER_TEMP/parola-extension.pem"

          rm -rf "$RELEASE_DIR" "$BUILD_DIR" "${BUILD_DIR}.crx"
          mkdir -p "$RELEASE_DIR" "$BUILD_DIR/content"

          cp extension/manifest.json extension/background.js extension/popup.html extension/popup.js extension/review.html extension/review.js extension/ui.css "$BUILD_DIR/"
          cp extension/content/duolingo.js "$BUILD_DIR/content/"

          python3 - "$BUILD_DIR/manifest.json" "$VERSION" "${GITHUB_SHA::8}" <<'PY'
          import json, sys
          path, version, commit = sys.argv[1:]
          with open(path) as f:
              manifest = json.load(f)
          manifest["version"] = version
          manifest["version_name"] = f"{version} · {commit}"
          with open(path, "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY

          printf '%s' "$PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          "$CHROME_PATH" --headless=new --no-sandbox \
            --pack-extension="$BUILD_DIR" \
            --pack-extension-key="$KEY_FILE"

          CRX_FILE="${BUILD_DIR}.crx"
          test -s "$CRX_FILE"

          HEX_ID="$(openssl rsa -in "$KEY_FILE" -pubout -outform DER 2>/dev/null | openssl dgst -sha256 -binary | xxd -p -c 256 | cut -c1-32)"
          EXTENSION_ID="$(python3 - "$HEX_ID" <<'PY'
          import sys
          print(''.join(chr(ord('a') + int(ch, 16)) for ch in sys.argv[1]))
          PY
          )"

          cp "$CRX_FILE" "$RELEASE_DIR/parola-duolingo.crx"
          cat > "$RELEASE_DIR/updates.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <gupdate xmlns="http://www.google.com/update2/response" protocol="2.0">
            <app appid="$EXTENSION_ID">
              <updatecheck codebase="$EXTENSION_CRX_URL" version="$VERSION" />
            </app>
          </gupdate>
          EOF
          cat > "$RELEASE_DIR/version.json" <<EOF
          {
            "id": "$EXTENSION_ID",
            "version": "$VERSION",
            "commit": "$GITHUB_SHA",
            "updateUrl": "$EXTENSION_UPDATE_URL"
          }
          EOF

          echo "EXTENSION_ID=$EXTENSION_ID" >> "$GITHUB_ENV"
          echo "EXTENSION_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check out public site
        uses: actions/checkout@v7
        with:
          repository: GuyMichaely/guymichaely.github.io
          ref: main
          path: public-site
          persist-credentials: false

      - name: Configure public-site deploy key
        env:
          PAGES_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PAGES_DEPLOY_KEY"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$PAGES_DEPLOY_KEY" > "$HOME/.ssh/parola-pages-deploy-key"
          chmod 600 "$HOME/.ssh/parola-pages-deploy-key"
          ssh-keyscan github.com >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          cat > "$HOME/.ssh/config" <<EOF
          Host parola-pages-deploy
            HostName github.com
            User git
            IdentityFile $HOME/.ssh/parola-pages-deploy-key
            IdentitiesOnly yes
          EOF
          chmod 600 "$HOME/.ssh/config"

          git -C public-site remote set-url origin git@parola-pages-deploy:GuyMichaely/guymichaely.github.io.git
          git -C public-site ls-remote origin HEAD >/dev/null

      - name: Publish signed extension
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public-site/extension
          mkdir -p public-site/extension
          cp -a "$RUNNER_TEMP/parola-extension-release/." public-site/extension/

          git -C public-site config user.name "github-actions[bot]"
          git -C public-site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C public-site add extension

          if git -C public-site diff --cached --quiet; then
            echo "No extension release changes to publish."
            exit 0
          fi

          git -C public-site commit -m "Publish Parola extension $EXTENSION_VERSION"
          git -C public-site pull --rebase origin main
          git -C public-site push origin main

          echo "Published Parola extension $EXTENSION_VERSION ($EXTENSION_ID)."
