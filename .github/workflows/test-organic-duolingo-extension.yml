name: Test organic Duolingo extension
run-name: Organic Duolingo E2E · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "extension/content/duolingo.js"
      - "extension/background.js"
      - "extension/review.html"
      - "extension/review.js"
      - "extension/tests/organic-duolingo.mjs"
      - "extension/tests/fixtures/duolingo-session-state.b64"
      - ".github/workflows/test-organic-duolingo-extension.yml"

permissions:
  contents: write

concurrency:
  group: parola-organic-duolingo-extension
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Publish this run ID
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > .github/latest-organic-duolingo-extension-run
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/latest-organic-duolingo-extension-run
          git commit -m "Record latest organic Duolingo probe run [skip ci]" || true
          git pull --rebase origin main
          git push

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install browser dependencies
        working-directory: extension
        run: |
          npm install --ignore-scripts
          npx puppeteer browsers install chrome
          node --check tests/organic-duolingo.mjs

      - name: Probe a real Duolingo lesson with Parola loaded
        working-directory: extension
        env:
          DUOLINGO_CAPTURE_DIR: organic-duolingo-capture
          DUOLINGO_SESSION_STATE_FILE: tests/fixtures/duolingo-session-state.b64
        run: xvfb-run -a node tests/organic-duolingo.mjs

      - name: Upload organic lesson artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: organic-duolingo-extension-probe
          path: extension/organic-duolingo-capture
          if-no-files-found: warn
          retention-days: 7
